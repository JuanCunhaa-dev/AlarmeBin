name: Signed private release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ vars.PRIVATE_SIGNING_READY == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare private release certificate
        shell: powershell
        timeout-minutes: 2
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64 -or -not $env:CERTIFICATE_PASSWORD) {
            throw 'Os secrets do certificado nao estao configurados.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'alarmebin-release.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64.Trim()))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:CERTIFICATE_PASSWORD.Trim()
          )
          if (-not $cert.HasPrivateKey) { throw 'O PFX nao possui chave privada.' }
          if ($cert.Thumbprint -ne 'EF93510E6694345DCA8A960D634E0EA1C202D87D') {
            throw 'Certificado inesperado.'
          }
      - run: npm run check
      - run: npm test
      - name: Build signed release
        run: npm run dist
        env:
          WIN_CSC_LINK: ${{ runner.temp }}\alarmebin-release.pfx
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Verify release signature
        shell: powershell
        run: |
          $installer = Get-ChildItem release\AlarmeBin-Setup-*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -in @('NotSigned', 'HashMismatch')) { throw "Assinatura invalida: $($signature.Status)" }
          if (-not $signature.SignerCertificate) { throw 'O instalador nao possui certificado de assinatura.' }
          if ($signature.SignerCertificate.Thumbprint -ne 'EF93510E6694345DCA8A960D634E0EA1C202D87D') { throw 'Assinante inesperado.' }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/AlarmeBin-Private-Kit-*.zip
            release/AlarmeBin-Setup-*.exe
            release/AlarmeBin-Setup-*.exe.blockmap
            distribution/AlarmeBin-Public.cer
      - name: Remove temporary certificate
        if: ${{ always() }}
        shell: powershell
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'alarmebin-release.pfx'
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }
